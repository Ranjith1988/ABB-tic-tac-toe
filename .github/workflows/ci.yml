name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet restore backend/TicTacToe.sln
      - run: >-
          dotnet test backend/tests/TicTacToe.Api.Tests/TicTacToe.Api.Tests.csproj
          --configuration Release --no-restore
          /p:CollectCoverage=true
          /p:CoverletOutputFormat=cobertura
          /p:Exclude="[TicTacToe.Api]TicTacToe.Api.Program"
          /p:ExcludeByAttribute=CompilerGeneratedAttribute

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: npm test -- --code-coverage
        working-directory: frontend
